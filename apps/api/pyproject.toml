[project]
name = "clip-farm-api"
version = "0.1.0"
description = "Landscape-to-vertical video processing API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "cryptography>=44,<46",
  "fastapi>=0.115,<1",
  "google-cloud-speech>=2.30,<3",
  "google-cloud-storage>=2.19,<4",
  "google-genai>=1.0,<2",
  "huey>=2.5,<3",
  "httpx>=0.28,<1",
  "mediapipe==0.10.21",
  "pydantic-settings>=2.6,<3",
  "pysubs2>=1.8,<2",
  "python-multipart>=0.0.12,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
  "yt-dlp>=2025.1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  # Only `tools/vendor_fonts.py` needs it, and only when the vendored Title
  # faces are rebuilt. The faces themselves are committed.
  "fonttools>=4.50,<5",
]
ai-local = ["faster-whisper>=1.1,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
