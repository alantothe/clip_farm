server {
  listen 80;
  server_name _;
  client_max_body_size 10m;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
  }

  location /health {
    proxy_pass http://api:8000/health;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}

